[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailrocket-adaptive-prefetch"
version = "0.1.0"
description = "Causal adaptive web content prefetching on real RetailRocket clickstreams"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3"]

[project.scripts]
webprefetch = "webprefetch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
